[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-realestate-acc"
version = "1.0.0"
description = "APG Real Estate Accounting — realestate domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "realestate", "acc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-realestate-acc[streaming]",
    "apg-realestate-acc[nlp]",
    "apg-realestate-acc[vision]",
    "apg-realestate-acc[geo]",
    "apg-realestate-acc[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/realestate/acc/CHANGELOG.md"


[project.scripts]
apg-realestate-acc = "apg_realestate_acc.app:main"
[project.entry-points."apg.capabilities"]
realestate_acc = "apg_realestate_acc:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_realestate_acc" = "."}
packages    = ["apg_realestate_acc"]

[tool.setuptools.package-data]
"apg_realestate_acc" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
