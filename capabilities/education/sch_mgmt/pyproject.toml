[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-education-sch_mgmt"
version = "1.0.0"
description = "APG School Management — education domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "education", "sch_mgmt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-education-sch_mgmt[streaming]",
    "apg-education-sch_mgmt[nlp]",
    "apg-education-sch_mgmt[vision]",
    "apg-education-sch_mgmt[geo]",
    "apg-education-sch_mgmt[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/education/sch_mgmt/CHANGELOG.md"


[project.scripts]
apg-education-sch_mgmt = "apg_education_sch_mgmt.app:main"
[project.entry-points."apg.capabilities"]
education_sch_mgmt = "apg_education_sch_mgmt:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_education_sch_mgmt" = "."}
packages    = ["apg_education_sch_mgmt"]

[tool.setuptools.package-data]
"apg_education_sch_mgmt" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
