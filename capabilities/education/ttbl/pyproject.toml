[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-education-ttbl"
version = "1.0.0"
description = "APG Timetabling & Scheduling — education domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "education", "ttbl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-education-ttbl[streaming]",
    "apg-education-ttbl[nlp]",
    "apg-education-ttbl[vision]",
    "apg-education-ttbl[geo]",
    "apg-education-ttbl[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/education/ttbl/CHANGELOG.md"


[project.scripts]
apg-education-ttbl = "apg_education_ttbl.app:main"
[project.entry-points."apg.capabilities"]
education_ttbl = "apg_education_ttbl:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_education_ttbl" = "."}
packages    = ["apg_education_ttbl"]

[tool.setuptools.package-data]
"apg_education_ttbl" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
