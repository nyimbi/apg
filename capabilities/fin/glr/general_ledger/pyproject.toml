[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-fin-general_ledger"
version = "2.1.0"
description = "APG Financial Management General Ledger — fin domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "fin", "general_ledger"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-fin-general_ledger[streaming]",
    "apg-fin-general_ledger[nlp]",
    "apg-fin-general_ledger[vision]",
    "apg-fin-general_ledger[geo]",
    "apg-fin-general_ledger[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/fin/glr/general_ledger/CHANGELOG.md"


[project.scripts]
apg-fin-general_ledger = "apg_fin_general_ledger.app:main"
[project.entry-points."apg.capabilities"]
glr_general_ledger = "apg_fin_general_ledger:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_fin_general_ledger" = "."}
packages    = ["apg_fin_general_ledger"]

[tool.setuptools.package-data]
"apg_fin_general_ledger" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
