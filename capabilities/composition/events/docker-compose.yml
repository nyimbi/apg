# APG Event Streaming Bus - Docker Compose Configuration
# Complete development and testing environment
# © 2025 Datacraft. All rights reserved.

version: '3.8'

services:
  # Event Streaming Bus Application
  event-streaming-bus:
    build:
      context: .
      dockerfile: Dockerfile
      target: application
    container_name: apg-event-streaming-bus
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://esb_user:esb_password@postgres:5432/apg_event_streaming_bus
      - REDIS_URL=redis://redis:6379/0
      - BYTEWAX_FLOW_ID=bytewax:9092
      - LOG_LEVEL=DEBUG
      - API_PORT=8080
      - METRICS_PORT=9090
      - METRICS_ENABLED=true
      - TRACING_ENABLED=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bytewax:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - apg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: apg-esb-postgres
    environment:
      - POSTGRES_DB=apg_event_streaming_bus
      - POSTGRES_USER=esb_user
      - POSTGRES_PASSWORD=esb_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - apg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esb_user -d apg_event_streaming_bus"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: apg-esb-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - apg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Bytewax (Zookeeper-less KRaft mode)
  bytewax:
    image: confluentinc/cp-bytewax:7.4.0
    container_name: apg-esb-bytewax
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      BYTEWAX_NODE_ID: 1
      BYTEWAX_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      BYTEWAX_ADVERTISED_LISTENERS: 'PLAINTEXT://bytewax:29092,PLAINTEXT_HOST://apg-event-streaming'
      BYTEWAX_LISTENERS: 'PLAINTEXT://bytewax:29092,CONTROLLER://bytewax:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      BYTEWAX_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      BYTEWAX_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      BYTEWAX_CONTROLLER_QUORUM_VOTERS: '1@bytewax:29093'
      BYTEWAX_PROCESS_ROLES: 'broker,controller'
      BYTEWAX_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      BYTEWAX_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      BYTEWAX_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      BYTEWAX_TRANSACTION_STATE_LOG_MIN_ISR: 1
      BYTEWAX_LOG_DIRS: '/tmp/kraft-combined-logs'
      BYTEWAX_JMX_PORT: 9101
      BYTEWAX_JMX_HOSTNAME: localhost
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - bytewax_data:/tmp/kraft-combined-logs
    networks:
      - apg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bytewax-broker-api-versions", "--bootstrap-server", "bytewax:29092"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Bytewax UI for development
  bytewax-ui:
    image: provectuslabs/bytewax-ui:latest
    container_name: apg-esb-bytewax-ui
    ports:
      - "8081:8080"
    environment:
      BYTEWAX_CLUSTERS_0_NAME: local
      BYTEWAX_CLUSTERS_0_BOOTSTRAPSERVERS: bytewax:29092
      BYTEWAX_CLUSTERS_0_METRICS_PORT: 9101
    depends_on:
      - bytewax
    networks:
      - apg-network
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: apg-esb-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - apg-network
    restart: unless-stopped

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: apg-esb-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - apg-network
    restart: unless-stopped

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: apg-esb-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - apg-network
    restart: unless-stopped

  # Elasticsearch for log aggregation
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: apg-esb-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - apg-network
    restart: unless-stopped

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: apg-esb-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - apg-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bytewax_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  apg-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16