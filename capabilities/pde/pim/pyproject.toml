[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-pde-pim"
version = "2.1.0"
description = "APG Product Information Management — pde domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "pde", "pim"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-pde-pim[streaming]",
    "apg-pde-pim[nlp]",
    "apg-pde-pim[vision]",
    "apg-pde-pim[geo]",
    "apg-pde-pim[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/pde/pim/CHANGELOG.md"


[project.scripts]
apg-pde-pim = "apg_pde_pim.app:main"
[project.entry-points."apg.capabilities"]
pde_pim = "apg_pde_pim:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_pde_pim" = "."}
packages    = ["apg_pde_pim"]

[tool.setuptools.package-data]
"apg_pde_pim" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
