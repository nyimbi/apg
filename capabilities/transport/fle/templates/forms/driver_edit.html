<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }} — APG Fleet</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fle.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fle-app">
<main class="fle-main fle-form-page">
  <header class="fle-page-header">
    <a href="{{ url_for('fle_views.detail_driver', driver_id=driver.id) }}" class="fle-breadcrumb"><i class="fa-solid fa-chevron-left"></i> {{ driver.name }}</a>
    <h1><i class="fa-solid fa-pen"></i> {{ page_title }}</h1>
  </header>
  {% if error %}<div class="fle-alert fle-alert-danger">{{ error }}</div>{% endif %}
  <section class="fle-card">
    <form method="POST" class="fle-form">
      <div class="fle-form-grid">
        <div class="fle-form-group"><label for="phone">Phone</label><input type="tel" id="phone" name="phone" value="{{ driver.phone or '' }}" class="fle-input"></div>
        <div class="fle-form-group"><label for="email">Email</label><input type="email" id="email" name="email" value="{{ driver.email or '' }}" class="fle-input"></div>
        <div class="fle-form-group"><label for="licence_expiry">Licence Expiry</label><input type="datetime-local" id="licence_expiry" name="licence_expiry" class="fle-input"></div>
        <div class="fle-form-group"><label for="cpc_expiry">CPC Expiry</label><input type="datetime-local" id="cpc_expiry" name="cpc_expiry" class="fle-input"></div>
        <div class="fle-form-group"><label for="medical_expiry">Medical Expiry</label><input type="datetime-local" id="medical_expiry" name="medical_expiry" class="fle-input"></div>
        <div class="fle-form-group"><label for="depot_id">Depot ID</label><input type="text" id="depot_id" name="depot_id" value="{{ driver.depot_id or '' }}" class="fle-input"></div>
      </div>
      <div class="fle-form-group fle-form-full"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="3" class="fle-textarea">{{ driver.notes }}</textarea></div>
      <div class="fle-form-actions">
        <a href="{{ url_for('fle_views.detail_driver', driver_id=driver.id) }}" class="fle-btn fle-btn-outline">Cancel</a>
        <button type="submit" class="fle-btn fle-btn-primary"><i class="fa-solid fa-save"></i> Save Changes</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
