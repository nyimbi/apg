<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }} — APG Fleet</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fle.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fle-app">
<main class="fle-main fle-form-page">
  <header class="fle-page-header">
    <a href="{{ url_for('fle_views.detail_vehicle', vehicle_id=vehicle.id) }}" class="fle-breadcrumb"><i class="fa-solid fa-chevron-left"></i> {{ vehicle.registration }}</a>
    <h1><i class="fa-solid fa-pen"></i> {{ page_title }}</h1>
  </header>
  {% if error %}<div class="fle-alert fle-alert-danger">{{ error }}</div>{% endif %}
  <section class="fle-card">
    <form method="POST" class="fle-form">
      <div class="fle-form-grid">
        <div class="fle-form-group">
          <label for="odometer_km">Odometer (km)</label>
          <input type="number" id="odometer_km" name="odometer_km" min="0" step="0.01" value="{{ vehicle.odometer_km }}" class="fle-input">
        </div>
        <div class="fle-form-group">
          <label for="colour">Colour</label>
          <input type="text" id="colour" name="colour" value="{{ vehicle.colour }}" class="fle-input">
        </div>
        <div class="fle-form-group">
          <label for="depot_id">Depot ID</label>
          <input type="text" id="depot_id" name="depot_id" value="{{ vehicle.depot_id or '' }}" class="fle-input">
        </div>
      </div>
      <div class="fle-form-group fle-form-full">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3" class="fle-textarea">{{ vehicle.notes }}</textarea>
      </div>
      <div class="fle-form-actions">
        <a href="{{ url_for('fle_views.detail_vehicle', vehicle_id=vehicle.id) }}" class="fle-btn fle-btn-outline">Cancel</a>
        <button type="submit" class="fle-btn fle-btn-primary"><i class="fa-solid fa-save"></i> Save Changes</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
