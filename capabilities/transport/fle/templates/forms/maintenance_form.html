<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }} — APG Fleet</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fle.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="fle-app">
<main class="fle-main fle-form-page">
  <header class="fle-page-header">
    <a href="{{ url_for('fle_views.list_maintenance') }}" class="fle-breadcrumb"><i class="fa-solid fa-chevron-left"></i> Maintenance</a>
    <h1><i class="fa-solid fa-plus"></i> {{ page_title }}</h1>
  </header>
  {% if error %}<div class="fle-alert fle-alert-danger">{{ error }}</div>{% endif %}
  <section class="fle-card">
    <form method="POST" class="fle-form">
      <div class="fle-form-grid">
        <div class="fle-form-group">
          <label for="vehicle_id">Vehicle *</label>
          <select id="vehicle_id" name="vehicle_id" required class="fle-select">
            <option value="">— Select vehicle —</option>
            {% for v in vehicles %}<option value="{{ v.id }}">{{ v.registration }}</option>{% endfor %}
          </select>
        </div>
        <div class="fle-form-group">
          <label for="maintenance_type">Type *</label>
          <select id="maintenance_type" name="maintenance_type" required class="fle-select">
            {% for t in maintenance_types %}<option value="{{ t }}">{{ t|replace('_',' ')|title }}</option>{% endfor %}
          </select>
        </div>
        <div class="fle-form-group fle-form-full">
          <label for="description">Description *</label>
          <input type="text" id="description" name="description" required class="fle-input" placeholder="e.g. Annual service, brake replacement">
        </div>
        <div class="fle-form-group"><label for="scheduled_date">Scheduled Date *</label><input type="datetime-local" id="scheduled_date" name="scheduled_date" required class="fle-input"></div>
        <div class="fle-form-group"><label for="estimated_cost">Estimated Cost</label><input type="number" id="estimated_cost" name="estimated_cost" min="0" step="0.01" placeholder="0.00" class="fle-input"></div>
        <div class="fle-form-group"><label for="currency">Currency</label><input type="text" id="currency" name="currency" value="KES" class="fle-input"></div>
      </div>
      <div class="fle-form-group fle-form-full"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="3" class="fle-textarea"></textarea></div>
      <div class="fle-form-actions">
        <a href="{{ url_for('fle_views.list_maintenance') }}" class="fle-btn fle-btn-outline">Cancel</a>
        <button type="submit" class="fle-btn fle-btn-primary"><i class="fa-solid fa-save"></i> Schedule Maintenance</button>
      </div>
    </form>
  </section>
</main>
</body>
</html>
