<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'Error' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="{{ url_for('imex_views.dashboard') }}">
                    <i class="fas fa-exchange-alt"></i> IMEX Dashboard
                </a>
            </div>
        </nav>

        <!-- Error Content -->
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card border-danger">
                        <div class="card-header bg-danger text-white">
                            <h4><i class="fas fa-exclamation-triangle"></i> Error</h4>
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">{{ title or 'An error occurred' }}</h5>
                            <p class="card-text">{{ error }}</p>

                            <div class="mt-4">
                                <a href="{{ url_for('imex_views.dashboard') }}" class="btn btn-primary">
                                    <i class="fas fa-home"></i> Return to Dashboard
                                </a>
                                <button onclick="history.back()" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Go Back
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
