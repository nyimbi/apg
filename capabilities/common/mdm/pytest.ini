[tool:pytest]
# APG Master Data Management (MDM) - pytest configuration
# Test configuration following APG standards

minversion = 6.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
norecursedirs = .git .tox dist build *.egg __pycache__

# Markers for test categorization
markers =
    unit: Unit tests that don't require external dependencies
    integration: Integration tests that require database or external services
    performance: Performance and benchmark tests
    security: Security-related tests
    api: API endpoint tests
    database: Database-specific tests
    service: Service layer tests
    models: Data model tests
    views: View/serialization tests
    slow: Tests that take longer than 1 second
    requires_redis: Tests that require Redis connection
    requires_postgres: Tests that require PostgreSQL connection
    requires_ollama: Tests that require Ollama AI service

# Async support
asyncio_mode = auto

# Coverage is intentionally opt-in for MDM. Battery-conscious package proof
# uses the focused command from README.md without coverage or xdist overhead.

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeouts (in seconds)
timeout = 300
timeout_method = thread

# Environment variables for testing
env =
    TESTING = 1
    LOG_LEVEL = DEBUG
    DATABASE_URL = postgresql://test:test@localhost:5432/mdm_test
    REDIS_URL = redis://localhost:6379/15
    DISABLE_AUTH = true
    DISABLE_RATE_LIMITING = true
