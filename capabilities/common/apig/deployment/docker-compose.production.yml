# APG Intelligent Gateway - Production Docker Compose
# Version: 1.0.0
# Date: August 11, 2025
# Status: Production Ready

version: '3.8'

services:
  # APIG Main Service
  apig:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: apig:latest
    container_name: apig-gateway
    restart: unless-stopped
    ports:
      - "${APIG_PORT:-8080}:8080"
      - "${APIG_METRICS_PORT:-9090}:9090"
    environment:
      # APG Platform Configuration
      - APG_API_KEY=${APG_API_KEY}
      - APG_TENANT_ID=${APG_TENANT_ID:-production}
      - APG_AUTH_SERVICE_URL=${APG_AUTH_SERVICE_URL:-https://auth.apg.datacraft.co.ke}
      - APG_MONITORING_SERVICE_URL=${APG_MONITORING_SERVICE_URL:-https://monitoring.apg.datacraft.co.ke}
      - APG_CONFIG_SERVICE_URL=${APG_CONFIG_SERVICE_URL:-https://config.apg.datacraft.co.ke}
      - APG_AI_ORCHESTRATION_SERVICE_URL=${APG_AI_ORCHESTRATION_SERVICE_URL:-https://ai.apg.datacraft.co.ke}
      - APG_MESSAGE_QUEUE_SERVICE_URL=${APG_MESSAGE_QUEUE_SERVICE_URL:-https://queue.apg.datacraft.co.ke}
      - APG_AUDIT_COMPLIANCE_SERVICE_URL=${APG_AUDIT_COMPLIANCE_SERVICE_URL:-https://audit.apg.datacraft.co.ke}
      
      # AI Configuration
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-60}
      - OLLAMA_MAX_RETRIES=${OLLAMA_MAX_RETRIES:-3}
      
      # Caching Configuration
      - REDIS_URL=redis://redis:6379
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - INTELLIGENT_CACHE_ENABLED=${INTELLIGENT_CACHE_ENABLED:-true}
      
      # Performance Configuration
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-10000}
      - CONNECTION_TIMEOUT=${CONNECTION_TIMEOUT:-30000}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-60000}
      - WORKER_PROCESSES=${WORKER_PROCESSES:-4}
      
      # Security Configuration
      - TLS_ENABLED=${TLS_ENABLED:-true}
      - THREAT_DETECTION_ENABLED=${THREAT_DETECTION_ENABLED:-true}
      - RATE_LIMITING_ENABLED=${RATE_LIMITING_ENABLED:-true}
      
      # WASM Configuration
      - WASM_RUNTIME_ENABLED=${WASM_RUNTIME_ENABLED:-true}
      - WASM_MAX_MODULES=${WASM_MAX_MODULES:-100}
      - WASM_EXECUTION_TIMEOUT=${WASM_EXECUTION_TIMEOUT:-5000}
      - WASM_MEMORY_LIMIT_MB=${WASM_MEMORY_LIMIT_MB:-64}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - STRUCTURED_LOGGING=${STRUCTURED_LOGGING:-true}
      
    volumes:
      - ./config:/app/config:ro
      - ./wasm_modules:/app/wasm_modules:ro
      - ./logs:/app/logs
      - ./ssl:/app/ssl:ro
      - apig_data:/app/data
      
    networks:
      - apig_network
      - apg_platform
      
    depends_on:
      - ollama
      - redis
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Ollama AI Service
  ollama:
    image: ollama/ollama:latest
    container_name: apig-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_QUEUE=${OLLAMA_MAX_QUEUE:-512}
      
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/models:/models:ro
      
    networks:
      - apig_network
      
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: apig-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server 
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
      
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      
    networks:
      - apig_network
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M
          
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: apig-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
      
    networks:
      - apig_network
      
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.2'
          memory: 512M

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: apig-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
      
    networks:
      - apig_network
      
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Nginx Load Balancer (Optional)
  nginx:
    image: nginx:alpine
    container_name: apig-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      
    networks:
      - apig_network
      - external
      
    depends_on:
      - apig
      
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

# Networks
networks:
  apig_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          
  apg_platform:
    external: true
    
  external:
    driver: bridge

# Volumes
volumes:
  apig_data:
    driver: local
    
  ollama_data:
    driver: local
    
  redis_data:
    driver: local
    
  prometheus_data:
    driver: local
    
  grafana_data:
    driver: local
    
  nginx_logs:
    driver: local

# Secrets (for production deployment)
secrets:
  apg_api_key:
    external: true
    
  tls_certificate:
    external: true
    
  tls_private_key:
    external: true