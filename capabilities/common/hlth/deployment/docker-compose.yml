version: '3.8'

services:
  # APG HLTH Core Services
  hlth-api-gateway:
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile.api-gateway
    image: datacraft/apg-hlth-api-gateway:latest
    container_name: hlth-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://hlth:${DB_PASSWORD:-hlth_password}@postgres:5432/hlth
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ML_ENABLED=true
      - AUTO_REMEDIATION=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change_this_encryption_key}
    depends_on:
      - postgres
      - redis
    networks:
      - hlth-network
    volumes:
      - hlth-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  hlth-health-service:
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile.health-service
    image: datacraft/apg-hlth-health-service:latest
    container_name: hlth-health-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://hlth:${DB_PASSWORD:-hlth_password}@postgres:5432/hlth
      - REDIS_URL=redis://redis:6379/0
      - ML_MODELS_PATH=/app/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PROCESSING_WORKERS=${PROCESSING_WORKERS:-4}
    depends_on:
      - postgres
      - redis
    networks:
      - hlth-network
    volumes:
      - hlth-models:/app/models
      - hlth-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  hlth-ml-engine:
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile.ml-engine
    image: datacraft/apg-hlth-ml-engine:latest
    container_name: hlth-ml-engine
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://hlth:${DB_PASSWORD:-hlth_password}@postgres:5432/hlth
      - REDIS_URL=redis://redis:6379/0
      - ML_MODELS_PATH=/app/models
      - TRAINING_SCHEDULE=0 2 * * *  # Daily at 2 AM
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
    networks:
      - hlth-network
    volumes:
      - hlth-models:/app/models
      - hlth-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  hlth-alert-engine:
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile.alert-engine
    image: datacraft/apg-hlth-alert-engine:latest
    container_name: hlth-alert-engine
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://hlth:${DB_PASSWORD:-hlth_password}@postgres:5432/hlth
      - REDIS_URL=redis://redis:6379/0
      - NOTIFICATION_WORKERS=${NOTIFICATION_WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
    networks:
      - hlth-network
    volumes:
      - hlth-logs:/app/logs

  hlth-remediation-engine:
    build:
      context: ../
      dockerfile: deployment/docker/Dockerfile.remediation-engine
    image: datacraft/apg-hlth-remediation-engine:latest
    container_name: hlth-remediation-engine
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://hlth:${DB_PASSWORD:-hlth_password}@postgres:5432/hlth
      - REDIS_URL=redis://redis:6379/0
      - SAFETY_CHECKS_ENABLED=true
      - ROLLBACK_ENABLED=true
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - postgres
      - redis
    networks:
      - hlth-network
    volumes:
      - hlth-logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-based remediation
    privileged: true  # Required for some remediation actions

  # Database Services
  postgres:
    image: postgres:15-alpine
    container_name: hlth-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=hlth
      - POSTGRES_USER=hlth
      - POSTGRES_PASSWORD=${DB_PASSWORD:-hlth_password}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    networks:
      - hlth-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../deployment/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../deployment/sql/partitions.sql:/docker-entrypoint-initdb.d/02-partitions.sql
      - ../deployment/sql/indexes.sql:/docker-entrypoint-initdb.d/03-indexes.sql
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hlth -d hlth"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: hlth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hlth-network
    volumes:
      - redis-data:/data
      - ../deployment/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    sysctls:
      - net.core.somaxconn=65535
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    container_name: hlth-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - hlth-network
    volumes:
      - ../deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../deployment/prometheus/rules.yml:/etc/prometheus/rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'

  grafana:
    image: grafana/grafana:latest
    container_name: hlth-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - hlth-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ../deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../deployment/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hlth-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
      - "6831:6831/udp"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - hlth-network
    volumes:
      - jaeger-data:/tmp

  # Load Balancer
  nginx:
    image: nginx:alpine
    container_name: hlth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - hlth-network
    volumes:
      - ../deployment/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../deployment/nginx/conf.d:/etc/nginx/conf.d
      - hlth-ssl-certs:/etc/ssl/certs
    depends_on:
      - hlth-api-gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Security Scanner (Optional)
  trivy:
    image: aquasec/trivy:latest
    container_name: hlth-trivy
    restart: "no"
    networks:
      - hlth-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - trivy-cache:/root/.cache/
    command: ["server", "--listen", "0.0.0.0:4954"]

networks:
  hlth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  hlth-models:
    driver: local
  hlth-logs:
    driver: local
  hlth-ssl-certs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
  trivy-cache:
    driver: local