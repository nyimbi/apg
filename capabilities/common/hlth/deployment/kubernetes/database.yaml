  05-functions.sql: |
    -- Function to create monthly partitions automatically
    CREATE OR REPLACE FUNCTION create_monthly_partition(table_name text, start_date date)
    RETURNS void AS $$
    DECLARE
        partition_name text;
        end_date date;
    BEGIN
        end_date := start_date + interval '1 month';
        partition_name := table_name || '_' || to_char(start_date, 'YYYY_MM');
        
        EXECUTE format('CREATE TABLE IF NOT EXISTS %I PARTITION OF %I
                        FOR VALUES FROM (%L) TO (%L)',
                       partition_name, table_name, start_date, end_date);
        
        -- Create indexes on the new partition
        EXECUTE format('CREATE INDEX IF NOT EXISTS %I ON %I (tenant_id, component_id)',
                       partition_name || '_tenant_component_idx', partition_name);
        EXECUTE format('CREATE INDEX IF NOT EXISTS %I ON %I (timestamp DESC)',
                       partition_name || '_timestamp_idx', partition_name);
        EXECUTE format('CREATE INDEX IF NOT EXISTS %I ON %I (name)',
                       partition_name || '_name_idx', partition_name);
        EXECUTE format('CREATE INDEX IF NOT EXISTS %I ON %I (dimension)',
                       partition_name || '_dimension_idx', partition_name);
    END;
    $$ LANGUAGE plpgsql;

    -- Function to drop old partitions (for data retention)
    CREATE OR REPLACE FUNCTION drop_old_partitions(table_name text, retention_months integer)
    RETURNS void AS $$
    DECLARE
        partition_name text;
        cutoff_date date;
    BEGIN
        cutoff_date := date_trunc('month', CURRENT_DATE - interval '1 month' * retention_months);
        
        FOR partition_name IN 
            SELECT schemaname||'.'||tablename 
            FROM pg_tables 
            WHERE tablename LIKE table_name || '_%' 
            AND tablename < table_name || '_' || to_char(cutoff_date, 'YYYY_MM')
        LOOP
            EXECUTE format('DROP TABLE IF EXISTS %s', partition_name);
            RAISE NOTICE 'Dropped partition: %', partition_name;
        END LOOP;
    END;
    $$ LANGUAGE plpgsql;

    -- Function to calculate health score
    CREATE OR REPLACE FUNCTION calculate_health_score(
        p_component_id varchar,
        p_tenant_id varchar,
        p_window_hours integer DEFAULT 24
    )
    RETURNS double precision AS $$
    DECLARE
        health_score double precision;
        dimension_scores jsonb := '{}';
        dimension_weights jsonb := '{"performance": 0.3, "availability": 0.3, "security": 0.2, "compliance": 0.1, "cost": 0.05, "user_experience": 0.05}';
        dim record;
    BEGIN
        -- Calculate scores for each dimension
        FOR dim IN 
            SELECT unnest(enum_range(NULL::health_dimension_enum)) as dimension
        LOOP
            SELECT AVG(CASE 
                WHEN value <= 50 THEN 100 - value
                WHEN value <= 80 THEN 100 - (value - 50) * 0.8
                ELSE GREATEST(0, 100 - (value - 80) * 2)
            END) INTO health_score
            FROM health_metrics
            WHERE component_id = p_component_id 
            AND tenant_id = p_tenant_id
            AND dimension = dim.dimension
            AND timestamp >= NOW() - (p_window_hours || ' hours')::interval;
            
            dimension_scores := dimension_scores || jsonb_build_object(dim.dimension::text, COALESCE(health_score, 75));
        END LOOP;
        
        -- Calculate weighted overall score
        health_score := 0;
        FOR dim IN 
            SELECT key, value FROM jsonb_each_text(dimension_scores)
        LOOP
            health_score := health_score + 
                (dim.value::double precision * COALESCE((dimension_weights->>dim.key)::double precision, 0.1));
        END LOOP;
        
        RETURN GREATEST(0, LEAST(100, health_score));
    END;
    $$ LANGUAGE plpgsql;

    -- Trigger function to update updated_at timestamp
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = NOW();
        RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    -- Create triggers for updated_at
    CREATE TRIGGER update_system_components_updated_at 
        BEFORE UPDATE ON system_components 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_health_baselines_updated_at 
        BEFORE UPDATE ON health_baselines 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_health_rules_updated_at 
        BEFORE UPDATE ON health_rules 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_enterprise_tenants_updated_at 
        BEFORE UPDATE ON enterprise_tenants 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_ml_models_updated_at 
        BEFORE UPDATE ON ml_models 
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: data-layer
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: data-layer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: apg-hlth
        app.kubernetes.io/component: cache
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsNonRoot: true
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        command: ["redis-server"]
        args: ["/usr/local/etc/redis/redis.conf"]
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hlth-secrets
              key: redis-password
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 999
          capabilities:
            drop:
            - ALL
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: cache-storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 20Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: cache-config
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    port 6379
    protected-mode no
    
    # General
    daemonize no
    supervised no
    pidfile /var/run/redis_6379.pid
    loglevel notice
    logfile ""
    
    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data
    
    # Memory management
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    # Append Only File
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    
    # Client output buffer limits
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    
    # Security
    # requirepass will be set via environment if redis-password secret exists
    
    # Advanced
    tcp-keepalive 300
    timeout 0