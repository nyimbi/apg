apiVersion: v1
kind: Namespace
metadata:
  name: hlth
  labels:
    name: hlth
    managed-by: apg
    tier: production
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: namespace
    app.kubernetes.io/part-of: apg-platform
    app.kubernetes.io/managed-by: apg-composition-engine
  annotations:
    apg.datacraft.co.ke/capability: "hlth"
    apg.datacraft.co.ke/description: "APG System Health Management"
    apg.datacraft.co.ke/owner: "platform-team"
    apg.datacraft.co.ke/contact: "hlth-support@datacraft.co.ke"

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hlth-resource-quota
  namespace: hlth
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    persistentvolumeclaims: "10"
    pods: "20"
    services: "10"
    secrets: "10"
    configmaps: "10"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: hlth-limit-range
  namespace: hlth
spec:
  limits:
  - default:
      cpu: "1"
      memory: 2Gi
    defaultRequest:
      cpu: "0.1"
      memory: 128Mi
    type: Container
  - default:
      storage: 10Gi
    type: PersistentVolumeClaim

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hlth-network-policy
  namespace: hlth
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: apg
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8080