apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlth-remediation-engine
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: remediation-engine
    app.kubernetes.io/part-of: hlth-automation
spec:
  replicas: 1  # Single replica to avoid conflicts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hlth-remediation-engine
  template:
    metadata:
      labels:
        app: hlth-remediation-engine
        app.kubernetes.io/name: apg-hlth
        app.kubernetes.io/component: remediation-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hlth-remediation-account
      securityContext:
        runAsNonRoot: false  # May need root for some remediation actions
        runAsUser: 0
        fsGroup: 0
      containers:
      - name: remediation-engine
        image: datacraft/apg-hlth-remediation-engine:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: "postgresql://hlth:$(DB_PASSWORD)@postgres-service:5432/hlth"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hlth-secrets
              key: db-password
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: hlth-integration-secrets
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: hlth-integration-secrets
              key: aws-secret-access-key
              optional: true
        envFrom:
        - configMapRef:
            name: hlth-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8084
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: true  # May need for some remediation
          readOnlyRootFilesystem: false
          capabilities:
            add:
            - SYS_ADMIN  # For container management
            - NET_ADMIN  # For network operations
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
      - name: tmp
        emptyDir: {}
      - name: logs
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: hlth-remediation-engine
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: remediation-engine
spec:
  type: ClusterIP
  selector:
    app: hlth-remediation-engine
  ports:
  - name: http
    port: 8084
    targetPort: 8084
    protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hlth-models-pvc
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: ml-storage
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods need access
  storageClassName: nfs-storage  # Use NFS or similar for shared access
  resources:
    requests:
      storage: 50Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hlth-service-account
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: service-account

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hlth-remediation-account
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: remediation-service-account

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hlth-remediation-role
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: remediation-rbac
rules:
# Pod management
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
# Service management
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Deployment management
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
# HPA management
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Node information
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
# Event creation
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hlth-remediation-binding
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: remediation-rbac
subjects:
- kind: ServiceAccount
  name: hlth-remediation-account
  namespace: hlth
roleRef:
  kind: ClusterRole
  name: hlth-remediation-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hlth-service-role
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: service-rbac
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hlth-service-binding
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: service-rbac
subjects:
- kind: ServiceAccount
  name: hlth-service-account
  namespace: hlth
roleRef:
  kind: Role
  name: hlth-service-role
  apiGroup: rbac.authorization.k8s.io