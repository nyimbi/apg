apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlth-ml-engine
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: ml-engine
    app.kubernetes.io/part-of: hlth-ai
spec:
  replicas: 1
  strategy:
    type: Recreate  # ML engine needs exclusive access to models
  selector:
    matchLabels:
      app: hlth-ml-engine
  template:
    metadata:
      labels:
        app: hlth-ml-engine
        app.kubernetes.io/name: apg-hlth
        app.kubernetes.io/component: ml-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: hlth-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ml-engine
        image: datacraft/apg-hlth-ml-engine:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8082
          protocol: TCP
        env:
        - name: DATABASE_URL
          value: "postgresql://hlth:$(DB_PASSWORD)@postgres-service:5432/hlth"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hlth-secrets
              key: db-password
        - name: ML_MODELS_PATH
          value: "/app/models"
        - name: CUDA_VISIBLE_DEVICES
          value: ""  # Disable GPU for now
        envFrom:
        - configMapRef:
            name: hlth-config
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8082
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8082
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: models
          mountPath: /app/models
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: tmp
        emptyDir: {}
      - name: models
        persistentVolumeClaim:
          claimName: hlth-models-pvc
      - name: logs
        emptyDir: {}

