apiVersion: v1
kind: ConfigMap
metadata:
  name: hlth-config
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: config
data:
  # Database Configuration
  database_host: "postgres-service"
  database_port: "5432"
  database_name: "hlth"
  database_user: "hlth"
  
  # Redis Configuration  
  redis_host: "redis-service"
  redis_port: "6379"
  redis_db: "0"
  
  # Application Configuration
  log_level: "INFO"
  workers: "4"
  processing_batch_size: "100"
  
  # ML Configuration
  ml_enabled: "true"
  ml_models_path: "/app/models"
  training_schedule: "0 2 * * *"
  prediction_cache_ttl: "900"
  
  # Remediation Configuration
  auto_remediation_enabled: "true"
  safety_checks_enabled: "true"
  rollback_enabled: "true"
  max_actions_per_hour: "10"
  
  # Alert Configuration
  alert_correlation_enabled: "true"
  false_positive_reduction: "true"
  notification_workers: "2"
  
  # Performance Configuration
  metric_processing_workers: "8"
  max_connections: "100"
  connection_timeout: "30"
  request_timeout: "60"
  
  # Monitoring Configuration
  metrics_enabled: "true"
  tracing_enabled: "true"
  health_check_interval: "30"
  
  # Security Configuration
  encryption_enabled: "true"
  audit_logging_enabled: "true"
  session_timeout: "3600"
  
  # Enterprise Features
  multi_tenancy_enabled: "true"
  compliance_enabled: "true"
  rbac_enabled: "true"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hlth-nginx-config
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: nginx-config
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging format
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log /var/log/nginx/access.log main;

        # Performance settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

        # Upstream for HLTH API Gateway
        upstream hlth_api {
            least_conn;
            server hlth-api-gateway:8080 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }

        server {
            listen 80;
            server_name _;

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # API routes
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                
                proxy_pass http://hlth_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
                
                proxy_connect_timeout 5s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                proxy_busy_buffers_size 8k;
                
                proxy_http_version 1.1;
                proxy_set_header Connection "";
            }

            # Authentication endpoints with stricter rate limiting
            location /api/v1/auth/ {
                limit_req zone=login burst=5 nodelay;
                
                proxy_pass http://hlth_api;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Request-ID $request_id;
            }

            # Static files (if any)
            location /static/ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }

            # Security.txt
            location = /.well-known/security.txt {
                return 200 "Contact: security@datacraft.co.ke\nExpires: 2025-12-31T23:59:59.000Z\nPreferred-Languages: en\n";
                add_header Content-Type text/plain;
            }
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hlth-prometheus-config
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'hlth-production'
        environment: 'production'

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # HLTH API Gateway
      - job_name: 'hlth-api-gateway'
        static_configs:
          - targets: ['hlth-api-gateway:8080']
        metrics_path: '/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s

      # HLTH Health Service
      - job_name: 'hlth-health-service'
        static_configs:
          - targets: ['hlth-health-service:8081']
        metrics_path: '/metrics'
        scrape_interval: 15s

      # HLTH ML Engine
      - job_name: 'hlth-ml-engine'
        static_configs:
          - targets: ['hlth-ml-engine:8082']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # HLTH Alert Engine
      - job_name: 'hlth-alert-engine'
        static_configs:
          - targets: ['hlth-alert-engine:8083']
        metrics_path: '/metrics'
        scrape_interval: 15s

      # HLTH Remediation Engine
      - job_name: 'hlth-remediation-engine'
        static_configs:
          - targets: ['hlth-remediation-engine:8084']
        metrics_path: '/metrics'
        scrape_interval: 15s

      # PostgreSQL
      - job_name: 'postgresql'
        static_configs:
          - targets: ['postgres-exporter:9187']
        scrape_interval: 30s

      # Redis
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 30s

      # Kubernetes Pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - hlth
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              - alertmanager:9093

  rules.yml: |
    groups:
      - name: hlth.rules
        rules:
          # High request rate
          - alert: HLTHHighRequestRate
            expr: rate(hlth_http_requests_total[5m]) > 1000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HLTH high request rate"
              description: "HLTH is receiving {{ $value }} requests per second"

          # High error rate
          - alert: HLTHHighErrorRate
            expr: rate(hlth_http_requests_total{status=~"5.."}[5m]) / rate(hlth_http_requests_total[5m]) > 0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "HLTH high error rate"
              description: "HLTH error rate is {{ $value | humanizePercentage }}"

          # High response time
          - alert: HLTHHighResponseTime
            expr: histogram_quantile(0.95, rate(hlth_request_duration_seconds_bucket[5m])) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "HLTH high response time"
              description: "HLTH 95th percentile response time is {{ $value }}s"

          # Database connection issues
          - alert: HLTHDatabaseConnectionIssues
            expr: hlth_database_connections_active / hlth_database_connections_max > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "HLTH database connection pool usage high"
              description: "HLTH database connection pool is {{ $value | humanizePercentage }} full"

          # ML model accuracy drop
          - alert: HLTHMLModelAccuracyDrop
            expr: hlth_ml_model_accuracy < 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "HLTH ML model accuracy dropped"
              description: "HLTH ML model accuracy is {{ $value | humanizePercentage }}"

          # Service down
          - alert: HLTHServiceDown
            expr: up{job=~"hlth-.*"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "HLTH service is down"
              description: "HLTH service {{ $labels.job }} is down"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hlth-grafana-dashboards
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: grafana-dashboards
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'hlth-dashboards'
        orgId: 1
        folder: 'HLTH'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/hlth

  hlth-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "HLTH System Overview",
        "tags": ["hlth", "overview"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(hlth_http_requests_total[5m])",
                "legendFormat": "{{method}} {{endpoint}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Response Time",
            "type": "graph", 
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(hlth_request_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile"
              },
              {
                "expr": "histogram_quantile(0.50, rate(hlth_request_duration_seconds_bucket[5m]))",
                "legendFormat": "50th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Health Assessments Per Hour",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(hlth_health_assessments_total[1h])",
                "legendFormat": "Assessments"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Active Alerts",
            "type": "stat",
            "targets": [
              {
                "expr": "sum(hlth_active_alerts)",
                "legendFormat": "Active"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 8}
          },
          {
            "id": 5,
            "title": "ML Predictions Per Hour",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(hlth_ml_predictions_total[1h])",
                "legendFormat": "Predictions"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 8}
          },
          {
            "id": 6,
            "title": "Remediation Actions",
            "type": "stat",
            "targets": [
              {
                "expr": "increase(hlth_remediation_actions_total{status=\"success\"}[1h])",
                "legendFormat": "Successful"
              }
            ],
            "gridPos": {"h": 4, "w": 6, "x": 18, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }