apiVersion: v1
kind: Secret
metadata:
  name: hlth-secrets
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Database credentials (base64 encoded)
  # Default values - MUST be changed in production
  # db-password: echo -n "hlth_production_password_change_me" | base64
  db-password: aGx0aF9wcm9kdWN0aW9uX3Bhc3N3b3JkX2NoYW5nZV9tZQ==
  
  # Application secret key
  # secret-key: echo -n "super-secret-key-change-in-production-very-long-and-random" | base64
  secret-key: c3VwZXItc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi12ZXJ5LWxvbmctYW5kLXJhbmRvbQ==
  
  # Encryption key for data at rest
  # encryption-key: echo -n "encryption-key-32-chars-long-random-string" | base64
  encryption-key: ZW5jcnlwdGlvbi1rZXktMzItY2hhcnMtbG9uZy1yYW5kb20tc3RyaW5n
  
  # JWT signing key
  # jwt-secret: echo -n "jwt-signing-key-very-secret-and-random-string" | base64
  jwt-secret: and0LXNpZ25pbmcta2V5LXZlcnktc2VjcmV0LWFuZC1yYW5kb20tc3RyaW5n
  
  # Redis password (optional)
  # redis-password: echo -n "redis_production_password" | base64
  redis-password: cmVkaXNfcHJvZHVjdGlvbl9wYXNzd29yZA==

---
apiVersion: v1
kind: Secret
metadata:
  name: hlth-tls-certs
  namespace: hlth
  labels:
    app.kubernetes.io/name: apg-hlth
    app.kubernetes.io/component: tls-certs
type: kubernetes.io/tls
data:
  # TLS certificate and key (base64 encoded)
  # These should be replaced with actual certificates in production
  # Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout tls.key -out tls.crt -subj "/CN=hlth.your-domain.com"
  tls.crt: 
  tls.key: 

