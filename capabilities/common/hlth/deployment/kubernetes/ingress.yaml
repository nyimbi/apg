            <div class="error-code">4XX</div>
            <h1>APG Health Management - Request Error</h1>
            <p>There's an issue with your request. Please check the URL and try again.</p>
            <p>If you believe this is an error, please contact our support team at <a href="mailto:hlth-support@datacraft.co.ke">hlth-support@datacraft.co.ke</a></p>
        </div>
