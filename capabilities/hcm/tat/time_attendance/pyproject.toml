[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-hcm-time_attendance"
version = "2.2.0"
description = "APG Time and Attendance Tracking — hcm domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "hcm", "time_attendance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-hcm-time_attendance[streaming]",
    "apg-hcm-time_attendance[nlp]",
    "apg-hcm-time_attendance[vision]",
    "apg-hcm-time_attendance[geo]",
    "apg-hcm-time_attendance[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/hcm/tat/time_attendance/CHANGELOG.md"


[project.scripts]
apg-hcm-time_attendance = "apg_hcm_time_attendance.app:main"
[project.entry-points."apg.capabilities"]
tat_time_attendance = "apg_hcm_time_attendance:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_hcm_time_attendance" = "."}
packages    = ["apg_hcm_time_attendance"]

[tool.setuptools.package-data]
"apg_hcm_time_attendance" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
