[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-hcm-employee_data_management"
version = "2.2.0"
description = "APG Employee Data Management — hcm domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "hcm", "employee_data_management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-hcm-employee_data_management[streaming]",
    "apg-hcm-employee_data_management[nlp]",
    "apg-hcm-employee_data_management[vision]",
    "apg-hcm-employee_data_management[geo]",
    "apg-hcm-employee_data_management[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/hcm/chr/employee_data_management/CHANGELOG.md"


[project.scripts]
apg-hcm-employee_data_management = "apg_hcm_employee_data_management.app:main"
[project.entry-points."apg.capabilities"]
chr_employee_data_management = "apg_hcm_employee_data_management:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_hcm_employee_data_management" = "."}
packages    = ["apg_hcm_employee_data_management"]

[tool.setuptools.package-data]
"apg_hcm_employee_data_management" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
