[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-grc-doc"
version = "2.2.0"
description = "APG Document Management — grc domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "grc", "doc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-grc-doc[streaming]",
    "apg-grc-doc[nlp]",
    "apg-grc-doc[vision]",
    "apg-grc-doc[geo]",
    "apg-grc-doc[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/grc/doc/CHANGELOG.md"


[project.scripts]
apg-grc-doc = "apg_grc_doc.app:main"
[project.entry-points."apg.capabilities"]
grc_doc = "apg_grc_doc:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_grc_doc" = "."}
packages    = ["apg_grc_doc"]

[tool.setuptools.package-data]
"apg_grc_doc" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
