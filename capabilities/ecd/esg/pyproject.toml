[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apg-ecd-esg"
version = "2.1.0"
description = "APG Sustainability and ESG Management — ecd domain capability"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
keywords = ["apg", "datacraft", "capability", "ecd", "esg"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
        "pydantic>=2.0",
    "uuid6>=0.4",
    "sqlalchemy>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
streaming = ["bytewax>=0.18"]
nlp       = ["transformers>=4.30", "sentence-transformers>=2.2"]
vision    = ["opencv-python>=4.0", "Pillow>=10.0"]
geo       = ["shapely>=2.0", "geopy>=2.4"]
crypto    = ["cryptography>=41.0"]
full      = [
    "apg-ecd-esg[streaming]",
    "apg-ecd-esg[nlp]",
    "apg-ecd-esg[vision]",
    "apg-ecd-esg[geo]",
    "apg-ecd-esg[crypto]",
]

[project.urls]
Homepage   = "https://www.datacraft.co.ke"
Repository = "https://github.com/datacraft/apg"
Changelog  = "https://github.com/datacraft/apg/blob/main/capabilities/ecd/esg/CHANGELOG.md"


[project.scripts]
apg-ecd-esg = "apg_ecd_esg.app:main"
[project.entry-points."apg.capabilities"]
ecd_esg = "apg_ecd_esg:get_capability_contract"

[tool.setuptools]
package-dir = {"apg_ecd_esg" = "."}
packages    = ["apg_ecd_esg"]

[tool.setuptools.package-data]
"apg_ecd_esg" = ["py.typed", "README.md", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
