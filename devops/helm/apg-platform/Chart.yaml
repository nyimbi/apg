apiVersion: v2
name: apg-platform
description: APG (Application Programming Generation) composable business platform

type: application
version: 1.0.0
appVersion: "1.0.0"

home: https://www.datacraft.co.ke
sources:
  - https://github.com/nyimbi/apg
maintainers:
  - name: Nyimbi Odero
    email: nyimbi@gmail.com

keywords:
  - apg
  - erp
  - fintech
  - healthcare
  - composable
  - ai
  - ollama
  - africa

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

  - name: nats
    version: "1.x.x"
    repository: https://nats-io.github.io/k8s/helm/charts/
    condition: nats.enabled

annotations:
  category: Infrastructure
  licenses: MIT
