# APG Platform Helm Chart — Default Values
# Override with: --values my-values.yaml or --set key=value

global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  # APG tenant configuration
  defaultTenant: "platform"

# ── APG Gateway ───────────────────────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/nyimbi/apg-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: apg.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: apg-tls
        hosts:
          - apg.example.com
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  env:
    APG_DEFAULT_TENANT: "platform"

# ── Temporal ──────────────────────────────────────────────────────────────────
temporal:
  enabled: true
  image:
    repository: temporalio/auto-setup
    tag: "1.26"
  service:
    port: 7233
  dynamicConfigFile: |
    limit.maxIDLength:
      - value: 255
        constraints: {}
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

temporalUI:
  enabled: true
  image:
    repository: temporalio/ui
    tag: "2.28"
  service:
    type: ClusterIP
    port: 8080

temporalWorker:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/nyimbi/apg-temporal-worker
    tag: "1.0.0"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ── NATS JetStream ────────────────────────────────────────────────────────────
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    cluster:
      enabled: true
      replicas: 3
  service:
    ports:
      client: 4222
      monitor: 8222

# ── OPA (Open Policy Agent) ───────────────────────────────────────────────────
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: "0.65-rootless"
  args:
    - "run"
    - "--server"
    - "--log-format=json"
    - "--bundle"
    - "/policies"
    - "--addr=0.0.0.0:8181"
  policiesConfigMap: apg-opa-policies  # pre-create with policies/apg/*.rego
  service:
    port: 8181
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Ollama (local AI models) ──────────────────────────────────────────────────
ollama:
  enabled: false  # Enable for AI-powered scoring features
  image:
    repository: ollama/ollama
    tag: "latest"
  service:
    port: 11434
  persistence:
    size: 50Gi  # Storage for downloaded models
  defaultModel: "mistral:7b"
  resources:
    requests:
      cpu: 2000m
      memory: 8Gi
    limits:
      cpu: 4000m
      memory: 16Gi
    # Uncomment for GPU nodes:
    # nvidia.com/gpu: "1"

# ── PostgreSQL (Bitnami dependency) ───────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: apg
    password: ""  # Set via secret or --set postgresql.auth.password=...
    database: apg
  primary:
    persistence:
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi

# ── Capabilities (individual service deployments) ─────────────────────────────
capabilities:
  # Enable individual capability services
  intelAlerts:
    enabled: true
    replicaCount: 1
    port: 8101
  finGlr:
    enabled: true
    replicaCount: 1
    port: 8202
  hcmPayroll:
    enabled: true
    replicaCount: 1
    port: 8401
  commonAuth:
    enabled: true
    replicaCount: 2
    port: 8501

# ── Secrets ───────────────────────────────────────────────────────────────────
secrets:
  # Create these secrets before installing:
  #   kubectl create secret generic apg-secrets \
  #     --from-literal=mpesa-consumer-key=... \
  #     --from-literal=stripe-secret-key=... \
  #     --from-literal=vault-key=...
  name: apg-secrets

# ── Network policies ──────────────────────────────────────────────────────────
networkPolicies:
  enabled: true
  # PCI DSS: isolate fintech capabilities in their own namespace
  pciNamespace: apg-pci

# ── Monitoring ────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  serviceMonitor:
    enabled: true  # Requires Prometheus operator
    namespace: monitoring
